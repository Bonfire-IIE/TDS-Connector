[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonfire-connector-portal"
version = "0.2.0"
description = "Bonfire-TDS connector portal Python backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "boto3>=1.35,<2",
  "paramiko>=3.5,<5",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<24",
  "openpyxl>=3.1,<4",
  "duckdb>=1.1,<2",
  "cryptography>=43,<47",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
asyncio_mode = "auto"

